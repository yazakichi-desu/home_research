<style>
:root{--forest:#1F5130;--moss:#6B8F5E;--cream:#F7F4EC;--ink:#23281E;--red:#B3402A;--light:#EDF2E6;--gray:#6E7566;--blue:#0F62A8;--line:#DDE2D4}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.55}
header{background:var(--forest);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 14px}
header h1{font-size:19px;letter-spacing:.04em}
header .sub{font-size:11px;color:#B9CBAD;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;position:sticky;top:0;background:var(--cream);z-index:5;border-bottom:1px solid var(--line)}
.chip{flex:none;border:1px solid var(--moss);color:var(--forest);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;background:#fff;cursor:pointer}
.chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
main{padding:8px 12px calc(env(safe-area-inset-bottom) + 40px)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}
.rank{flex:none;width:30px;height:30px;border-radius:50%;background:var(--forest);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.row.dim .rank{background:#A9B3A0}
.meta{flex:1;min-width:0}
.meta .nm{font-weight:800;font-size:14px;line-height:1.35}
.meta .st{font-size:11.5px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .tag{display:inline-block;font-size:10px;font-weight:700;color:var(--red);margin-top:3px}
.meta .tag.ok{color:var(--forest)}
.pills{flex:none;display:flex;gap:5px}
.pill{width:44px;border-radius:9px;text-align:center;padding:5px 0 6px}
.pill b{font-size:17px;display:block;line-height:1}
.pill span{font-size:9px;font-weight:700}
.pA{background:var(--forest);color:#fff}.pB{background:var(--moss);color:#fff}
.price{font-size:12px;font-weight:700;color:var(--ink);margin-top:2px}
h2.sec{font-size:13px;color:var(--gray);margin:22px 6px 4px;letter-spacing:.08em}
/* detail page (遷移型) */
.thumb{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--light)}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--moss);font-size:10px;font-weight:700;width:56px;height:56px}
.tabs{display:flex;background:var(--forest);padding:0 14px;gap:4px}
.tab{flex:1;text-align:center;color:#B9CBAD;font-weight:800;font-size:13.5px;padding:10px 0 12px;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:#fff}

#detail{display:none}
body.detail main,body.detail .chips,body.detail .tabs{display:none}
body.detail #detail{display:block}
.dhead{background:var(--forest);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5}
.back{background:none;border:none;color:#D8E4CF;font-size:14px;font-weight:800;cursor:pointer;padding:4px 0;margin-bottom:6px}
.dhead .nm{font-size:18px;font-weight:800;line-height:1.4}
.dhead .kd{font-size:11.5px;color:#B9CBAD;margin-top:3px}
.dbody{padding:14px 16px calc(env(safe-area-inset-bottom) + 30px)}
.abrow{display:flex;gap:10px;margin-bottom:14px}
.abbig{flex:1;border-radius:14px;color:#fff;text-align:center;padding:10px 0}
.abbig b{font-size:30px;line-height:1;display:block}.abbig span{font-size:10.5px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;color:var(--moss);letter-spacing:.08em;margin-bottom:8px}
.spec div{display:flex;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.spec div:last-child{border:none}
.spec dt{flex:none;width:82px;color:var(--moss);font-weight:700}
.spec dd{flex:1}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0}
.bar .lb{flex:none;width:88px;font-size:11.5px}
.bar .tr{flex:1;height:9px;background:var(--light);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;border-radius:5px;background:var(--forest)}
.bar .fl.mid{background:var(--moss)}.bar .fl.low{background:var(--red)}
.bar .vl{flex:none;width:38px;font-size:11px;font-weight:700;text-align:right}
.txt{font-size:13.5px}
.txt.warn{color:var(--red)}
a.go{display:block;text-align:center;background:var(--blue);color:#fff;font-weight:800;border-radius:14px;padding:14px;text-decoration:none;font-size:15px;margin:4px 0 12px}
/* carousel: ボタン送り・等倍表示 */
.cwrap{position:relative;background:#20241D;border-radius:14px;overflow:hidden;margin-bottom:14px}
.cwrap img{display:block;width:100%;height:auto;max-height:270px;object-fit:contain;cursor:zoom-in}
.cbtn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(247,244,236,.92);color:var(--forest);font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cbtn:disabled{opacity:.25}
.cbtn.prev{left:10px}.cbtn.next{right:10px}
.cnt{position:absolute;bottom:10px;right:12px;background:rgba(35,40,30,.7);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(10,12,9,.93);z-index:50;display:none}
#lb.on{display:block}
#lb .zw{width:100vw;height:100vh;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center}
#lb img{width:96vw;height:86vh;object-fit:contain;cursor:zoom-in;flex:none}
#lb.zoom .zw{display:block}
#lb.zoom img{width:190vw;height:auto;max-width:none;object-fit:initial;cursor:zoom-out}
@media (min-width:800px){#lb.zoom img{width:150vw}}
#lb .lbx{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer;padding:8px}
#lb .cbtn{background:rgba(247,244,236,.18);color:#fff}
#lb .cnt{bottom:calc(env(safe-area-inset-bottom) + 14px)}
/* memo */
.memo textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--cream);resize:vertical}
.memo .ms{font-size:10.5px;color:var(--moss);font-weight:700;margin-top:5px;text-align:right}
.mflag{color:var(--blue);font-weight:800;font-size:10px}
.cstage{font-size:11.5px;font-weight:800;color:var(--forest);letter-spacing:.04em;margin:12px 0 4px;padding-top:8px;border-top:1px dashed var(--line)}
.cstage:first-of-type{border-top:none;padding-top:0;margin-top:2px}
.card .task{margin:6px 0;padding:10px;border-radius:10px}
.clprog{font-size:10.5px;color:var(--moss);font-weight:700}
/* tasks timeline */
.ph{margin:20px 4px 8px;position:relative}
.ph .pname{font-size:13.5px;font-weight:800;color:var(--forest)}
.ph .pperiod{display:inline-block;background:var(--forest);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:1px}
.tline{border-left:3px solid var(--moss);margin-left:12px;padding-left:14px}
.task{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;align-items:flex-start;cursor:pointer}
.task.done{opacity:.45}.task.done .tt{text-decoration:line-through}
.cb{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--moss);margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.task.done .cb{background:var(--forest);border-color:var(--forest)}
.tt{font-size:13.5px;flex:1}
.pr{flex:none;font-size:9px;font-weight:800;border-radius:6px;padding:2px 6px;margin-top:2px}
.pr.high{background:var(--red);color:#fff}.pr.mid{background:var(--moss);color:#fff}.pr.low{background:var(--light);color:var(--gray)}
.pgbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 2px}
.pgbar .tr{height:10px;background:var(--light);border-radius:6px;overflow:hidden;margin-top:6px}
.pgbar .fl{height:100%;background:var(--forest)}
.upd{font-size:11pxcolor:var(--gray);text-align:center;margin-top:18px}
</style></head><body>

function pass(p){
 const st=p.status||'';
 if(mode==='ok'&&!(st.includes('対象')||st.includes('本命')||st.includes('保険')))return false;
 if(mode==='live'&&(st.includes('掲載終了')||st.includes('アーカイブ')))return false;
 if(mode==='kodate'&&!(p.kind||'').includes('戸建'))return false;
 if(mode==='mansion'&&!(p.kind||'').includes('マンション'))return false;
 return true}
function rows(list,dim){return list.filter(pass).sort((x,y)=>sort==='b'?y.b-x.b:sort==='p'?(x.price||9e9)-(y.price||9e9):y.a-x.a).map((p,i)=>{
 const t=(p.status||'').match(/【[^】]*】/);const tg=t?t[0]:'';
 return `<div class="row ${dim?'dim':''}" onclick="nav('${dim?'arch':'props'}',${p._i})">
 <div class="rank">${i+1}</div>${p.images&&p.images.length?`<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${p.images[0]}" onerror="this.outerHTML='<div class='thumb ph'>NO IMG</div>'">`:`<div class="thumb ph">写真待ち</div>`}<div class="meta">
 <div class="nm">${esc(p.name)}${p.provisional?' ★':''}</div>
 <div class="st">${esc(p.station||'')}</div>
 <div class="price">${p.price?p.price.toLocaleString()+'万円':'価格未定'}　${memoLoad(p.name)?'<span class="mflag">&#9998;メモ</span>　':''}<span class="tag ${tg.includes('対象')||tg.includes('本命')?'ok':''}">${esc(tg)}</span></div></div>
 <div class="pills"><div class="pill pA"><b>${p.a}</b><span>A案</span></div><div class="pill pB"><b>${p.b}</b><span>B案</span></div></div></div>`}).join('')}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){

function lbInside(e){
 const im=e.target, r=im.getBoundingClientRect();
 const nw=im.naturalWidth||1, nh=im.naturalHeight||1;
 const sc=Math.min(r.width/nw, r.height/nh);
 const dw=nw*sc, dh=nh*sc;
 const x0=r.left+(r.width-dw)/2, y0=r.top+(r.height-dh)/2;
 return e.clientX>=x0 && e.clientX<=x0+dw && e.clientY>=y0 && e.clientY<=y0+dh}

 const im=$('cimg'); if(im){im.src=cimgs[cidx];$('cprev').disabled=cidx===0;$('cnext').disabled=cidx===cimgs.length-1;$('ccnt').textContent=(cidx+1)+' / '+cimgs.length}}

function caroSet(i){
 cidx=Math.max(0,Math.min(cimgs.length-1,i));
 const im=$('cimg'); if(!im)return;
 im.src=cimgs[cidx];
 $('cprev').disabled=cidx===0; $('cnext').disabled=cidx===cimgs.length-1;
 $('ccnt').textContent=(cidx+1)+' / '+cimgs.length}
function showDetail(src,i){
 const p=D[src==='arch'?'arch':'props'][i];
 if(!p){location.hash='';return}
 cimgs=p.images||[]; cidx=0;
 const bars=D.ck.map(k=>{const v=p.scores[k],m=D.max[k],r=v/m;
 return `<div class="bar"><div class="lb">${D.labels[k]}</div><div class="tr"><div class="fl ${r>=0.6?'':r>=0.35?'mid':'low'}" style="width:${Math.max(4,r*100)}%"></div></div><div class="vl">${v}/${m}</div></div>`}).join('');
 const caro = cimgs.length?`<div class="cwrap"><img id="cimg" referrerpolicy="no-referrer" src="${cimgs[0]}" onclick="lbOpen()">
  <button class="cbtn prev" id="cprev" onclick="caroSet(cidx-1)">&#8249;</button>
  <button class="cbtn next" id="cnext" onclick="caroSet(cidx+1)">&#8250;</button>
  <div class="cnt" id="ccnt">1 / ${cimgs.length}</div></div>`:'';
 $('detail').innerHTML=`<div class="dhead"><button class="back" onclick="history.back()">&#8592; リストへ戻る</button>
 <div class="nm">${esc(p.name)}${p.provisional?' ★':''}</div><div class="kd">${esc(p.kind||'')}｜${p.price?p.price.toLocaleString()+'万円':'価格未定'}</div></div>
 <div class="dbody">
 ${caro}
 <div class="abrow"><div class="abbig pA"><b>${p.a}</b><span>A案 通園継続</span></div><div class="abbig pB"><b>${p.b}</b><span>B案 転園</span></div></div>
 ${p.url?`<a class="go" href="${p.url}" target="_blank" rel="noopener">掲載ページを開く &#8599;</a>`:''}
 <div class="card"><h3>スペック</h3><div class="spec">
 <div><dt>最寄駅</dt><dd>${esc(p.station||'')}</dd></div>
 <div><dt>築年・構造</dt><dd>${esc(p.built||'')}</dd></div>
 <div><dt>面積</dt><dd>${esc(p.area||'')}</dd></div>
 <div><dt>間取り</dt><dd>${esc(p.layout||'')}</dd></div>
 <div><dt>管理修繕</dt><dd>${esc(p.fee||'')}</dd></div>
 <div><dt>駐車場</dt><dd>${esc(p.parking||'')}</dd></div>
 <div><dt>状況</dt><dd>${esc(p.status||'')}</dd></div></div></div>
 <div class="card"><h3>共通スコア（${p.c}／80点）</h3>${bars}</div>
 <div class="card"><h3>判定</h3><div class="txt">${esc(p.comment||'')}</div></div>
 <div class="card"><h3>要確認・次の一手</h3><div class="txt warn">${esc(p.todo||'')}</div></div>
 ${p.checklist?`<div class="card"><h3>攻略チェックリスト <span class="clprog" id="clprog"></span></h3>${p.checklist.map(st=>`<div class="cstage">${esc(st.s)}</div>`+st.items.map(t=>{const dn=doneSet().has(t.id);return `<div class="task ${dn?'done':''}" onclick="tglCl('${t.id}',this)"><div class="cb">${dn?'&#10003;':''}</div><div class="tt">${esc(t.t)}</div></div>`}).join('')).join('')}</div>`:''}
 <div class="card memo"><h3>自分の評価メモ</h3>
 <textarea id="memoTa" placeholder="内見の印象・気になった点・家族の反応などを自由に">${esc(memoLoad(p.name))}</textarea>
 <div class="ms" id="memoStat">${memoLoad(p.name)?'保存済み':'この端末に自動保存されます'}</div></div></div>`;
 $('memoTa').addEventListener('input',()=>memoSave(p.name));
 document.body.classList.add('detail');
 window.scrollTo(0,0);
 if(cimgs.length)caroSet(0);
 clProg(p)}
function renderTasks(){const s=doneSet();
 const total=(D.tasks||[]).reduce((a,c)=>a+c.items.length,0);
 let h=`<div class="pgbar"><b style="font-size:13px">ロードマップ進捗　${s.size}／${total}</b><div class="tr"><div class="fl" style="width:${total?100*s.size/total:0}%"></div></div></div>`;
 (D.tasks||[]).forEach(c=>{
  h+=`<div class="ph"><span class="pname">${esc(c.cat)}</span><span class="pperiod">${esc(c.period||'')}</span></div><div class="tline">`;
  c.items.forEach(t=>{const dn=s.has(t.id);
   h+=`<div class="task ${dn?'done':''}" onclick="tgl('${t.id}')"><div class="cb">${dn?'&#10003;':''}</div><div class="tt">${esc(t.t)}</div><div class="pr ${t.p}">${t.p==='high'?'必須':t.p==='mid'?'重要':'随時'}</div></div>`});
  h+='</div>'});
 h+='<div class="upd">チェックはこの端末に保存されます</div>';
 $('main').innerHTML=h}
function tglCl(id,el){const s=doneSet();const on=!s.has(id);on?s.add(id):s.delete(id);localStorage.setItem('tasks_done',JSON.stringify([...s]));
 el.classList.toggle('done',on);el.querySelector('.cb').innerHTML=on?'&#10003;':'';
 const m=location.hash.match(/^#p\/(props|arch)\/(\d+)$/);if(m){clProg(D[m[1]==='arch'?'arch':'props'][+m[2]])}}
function clProg(p){if(!p.checklist)return;const s=doneSet();const all=p.checklist.flatMap(st=>st.items.map(t=>t.id));const dn=all.filter(id=>s.has(id)).length;const el=$('clprog');if(el)el.textContent='　'+dn+'／'+all.length+' 完了'}
window.addEventListener('hashchange',route);
route();
</script></body></html>
